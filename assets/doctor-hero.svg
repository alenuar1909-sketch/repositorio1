  <path d="M276 322 q16 -9 32 0 M332 322 q16 -9 32 0" stroke="#2B2420" stroke-width="6" fill="none" stroke-linecap="round"/>
  <ellipse cx="292" cy="338" rx="7" ry="5" fill="#2B2420"/><ellipse cx="348" cy="338" rx="7" ry="5" fill="#2B2420"/>
  <path d="M320 345 q-8 30 4 38" stroke="#A8744F" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M296 404 q24 14 48 0" stroke="#F4E9E0" stroke-width="5" fill="none" stroke-linecap="round"/>

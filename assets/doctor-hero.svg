    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9EFEF"/></linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D9A87F"/><stop offset="1" stop-color="#C58F65"/></linearGradient>
  </defs>
  <rect width="640" height="760" fill="url(#bg)"/>
  <rect x="40" y="70" width="170" height="520" fill="#fff" opacity=".35"/>
  <rect x="230" y="70" width="2" height="520" fill="#fff" opacity=".5"/>
  <circle cx="470" cy="190" r="150" fill="#fff" opacity=".28"/>
